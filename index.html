const BODY={DSLR:'<path d="M18 36h22l4-9h32l4 9h22v34H18z"/>',Mirrorless:'<rect x="16" y="32" width="88" height="38" rx="7"/><rect x="22" y="27" width="22" height="8" rx="3"/>',Action:'<rect x="34" y="24" width="52" height="44" rx="9"/><rect x="40" y="29" width="14" height="8" rx="2" fill="#475569"/>',Compact:'<rect x="18" y="34" width="84" height="34" rx="7"/><rect x="26" y="29" width="16" height="7" rx="2"/>'};
const LX={DSLR:[60,52,15],Mirrorless:[60,51,15],Action:[60,46,12],Compact:[70,51,13]};
const svgArt=c=>{const [x,y,r]=LX[c.t],k=COL[c.t];return `<svg viewBox="0 0 120 90"><defs><linearGradient id="g${c.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${k}" stop-opacity=".3"/><stop offset="1" stop-color="${k}" stop-opacity=".06"/></linearGradient></defs><rect width="120" height="90" fill="url(#g${c.id})"/><g fill="#1f2937">${BODY[c.t]}</g><circle cx="${x}" cy="${y}" r="${r}" fill="#0b1220" stroke="#94a3b8" stroke-width="2"/><circle cx="${x}" cy="${y}" r="${r*.55}" fill="${k}" opacity=".85"/><circle cx="${x-r*.2}" cy="${y-r*.25}" r="${r*.16}" fill="#fff" opacity=".8"/></svg>`};
const slug=c=>c.n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const art=c=>`<div class="ph">${svgArt(c)}<img src="photos/${slug(c)}.jpg" alt="${c.n}" loading="lazy" onerror="this.remove()"></div>`;
// ---------- MATCHING ----------
function doMatch(p){const b=BUD.find(x=>x[0]==p.bud);const all=D.map(c=>{let e=0,m=0;
if(b){m+=40;e+=c.p>=b[2]&&c.p<=b[3]?40:c.p<b[3]*1.12&&c.p>b[2]*.88?18:0}
if(p.pur){m+=30;e+=c.pur.includes(p.pur)?30:0}
if(p.type){m+=20;e+=c.t==p.type?20:0}
if(p.brand){m+=10;e+=c.b==p.brand?10:0}
return{c,s:m?Math.round(e/m*100):100}}).sort((a,z)=>z.s-a.s||a.c.p-z.c.p);
let l=all.filter(x=>x.s>=60);return l.length?l:all.slice(0,3)}
// ---------- VIEWS ----------
const fv=c=>`<button class="fv" data-act="fav" data-id="${c.id}" aria-label="Favorite">${I('heart',S.fav.includes(c.id)?'on':'')}</button>`;
const card=(c,s)=>`<article class="card" data-act="open" data-id="${c.id}"><div class="th">${art(c)}</div><div class="bd"><div class="row"><b>${c.n}</b>${fv(c)}</div><div class="pr">$${c.p}</div><ul><li>${c.mp} MP ${c.s}</li><li>${c.v}</li><li>${c.f[0]}</li></ul><button class="btn sm ghost" data-act="open" data-id="${c.id}">View Details</button></div>${s!=null?`<div class="ring" style="--p:${s}"><span>${s}%</span></div>`:''}</article>`;
const top=(t,r='')=>`<div class="top"><button class="ib" data-act="back" aria-label="Back">${I('back')}</button><h2>${t}</h2>${r||'<span style="width:42px"></span>'}</div>`;
const cmpBtn=()=>`<button class="ib" data-act="cmp" aria-label="Compare">${I('cmp')}${S.cmp.length?`<span class="bdg">${S.cmp.length}</span>`:''}</button>`;
const empty=(ic_,t,b)=>`<div class="empty">${I(ic_)}<p>${t}</p>${b?`<br><button class="btn" data-act="tab" data-id="match" style="max-width:240px;margin:auto">${b}</button>`:''}</div>`;
const sel=(id,l,opts,v,any)=>`<label for="${id}">${l}</label><select id="${id}" data-pf="${id}"><option value="">${any}</option>${opts.map(o=>`<option value="${o[0]}"${o[0]==v?' selected':''}>${o[1]}</option>`).join('')}</select>`;
const V={
home:()=>`<div class="top"><h1>CamMatch</h1><div style="display:flex;gap:8px">${cmpBtn()}</div></div>
<div class="sb">${I('match','sm')}<input id="q" placeholder="Search cameras, brands, or models..." value="${st.q}" autocomplete="off"></div>
<div id="hl">${homeBody()}</div>`,
match:()=>`<div class="top"><h1>Match</h1><span class="pill" style="visibility:hidden">.</span></div><p style="color:var(--mu)">Tell us what you need and we'll rank the best cameras for you.</p>
${sel('bud','Budget',BUD.map(b=>[b[0],b[1]]),S.pf.bud,'Any budget')}${sel('type','Camera Type',TYPES.map(t=>[t,t]),S.pf.type,'Any type')}${sel('pur','Photography Purpose',PURP.map(t=>[t,t]),S.pf.pur,'Any purpose')}${sel('brand','Preferred Brand',BRANDS.map(t=>[t,t]),S.pf.brand,'Any brand')}
<div style="height:24px"></div><button class="btn" data-act="find">${I('match','sm')} Find My Match</button>`,
results:()=>{const r=st.res;return top(r.title,`<button class="ib" data-act="sort" aria-label="Sort">${I('filter')}</button>`)+`<p style="color:var(--mu);margin:-4px 0 12px">${r.list.length} result${r.list.length==1?'':'s'} found · sorted by ${r.sort}</p><div class="grid">${r.list.map(x=>card(x.c,r.m?x.s:null)).join('')||empty('cam','No cameras found.')}</div>`},
details:()=>{const c=cam(st.sel),inC=S.cmp.includes(c.id);return top('Camera Details',fv(c))+`<div class="hero">${art(c)}</div>
<div class="row"><h1 style="font-size:22px">${c.n}</h1><h1 style="font-size:22px">$${c.p}</h1></div>
<div style="margin:8px 0 14px"><span class="tag">${c.b}</span><span class="tag">${c.t}</span>${c.pur.map(p=>`<span class="tag">${p}</span>`).join('')}</div>
<h2 style="margin-bottom:8px">Key Specifications</h2><div class="list">${[['sensor',c.mp+' MP '+c.s+' Sensor'],['vid',c.v],['iso','ISO '+c.iso],['bolt',c.fps+' fps Continuous Shooting'],['bat',c.bat],['wt',c.w+' g']].map(x=>`<div class="li">${I(x[0])}<span>${x[1]}</span></div>`).join('')}</div>
<h2 style="margin:16px 0 8px">Features</h2><div class="list">${c.f.map(f=>`<div class="li">${I('check')}<span>${f}</span></div>`).join('')}</div>
<div class="bar"><button class="btn ${inC?'ok':''}" data-act="addc" data-id="${c.id}">${I(inC?'check':'cmp','sm')} ${inC?'Added – View Compare':'Add to Compare'}</button></div>`},
compare:()=>{const l=S.cmp.map(cam);if(!l.length)return top('Compare Cameras')+empty('cmp','Nothing to compare yet. Open a camera and tap "Add to Compare" (up to 3).','Find Cameras');
const best=(f,m)=>{const v=l.map(c=>c[f]);return l.length>1?(m>0?Math.max(...v):Math.min(...v)):null};
const rows=[['Price','p',c=>'$'+c.p,-1],['Type','t',c=>c.t],['Sensor','s',c=>c.s],['Megapixels','mp',c=>c.mp+' MP',1],['Video','v',c=>c.v],['ISO','iso',c=>c.iso],['Burst','fps',c=>c.fps+' fps',1],['Battery','bat',c=>c.bat],['Weight','w',c=>c.w+' g',-1]];
return top('Compare Cameras',`<button class="ib" data-act="clr" aria-label="Clear">${I('x')}</button>`)+`<div class="cmp"><table><tr><th></th>${l.map(c=>`<th>${art(c)}<br>${c.n}<br><b>$${c.p}</b><br><button class="fv" data-act="rmc" data-id="${c.id}" style="font-size:12px">Remove</button></th>`).join('')}</tr>${rows.map(r=>{const b=r[3]?best(r[1],r[3]):null;return `<tr><td>${r[0]}</td>${l.map(c=>`<td class="${b!=null&&c[r[1]]==b?'best':''}">${r[2](c)}</td>`).join('')}</tr>`}).join('')}</table></div><p style="color:var(--mu);font-size:12.5px;margin-top:10px">Green = best value in that row.</p>`},
favs:()=>`<div class="top"><h1>Favorites</h1><span></span></div>`+(S.fav.length?`<div class="grid">${S.fav.map(cam).map(c=>card(c)).join('')}</div>`:empty('heart','No favorites yet. Tap the heart on any camera to save it – even offline.','Find a Camera')),
profile:()=>{const th=['auto','light','dark'];return `<div class="top"><h1>Profile</h1><span></span></div>
<div class="list"><div class="li"><span>Connection</span><small><span class="pill ${navigator.onLine?'':'off'}">${navigator.onLine?'Online':'Offline'}</span></small></div><div class="li"><span>Offline mode</span><small><span class="pill ${st.ready?'':'off'}">${st.ready?'Ready ✓':'Not cached yet'}</span></small></div></div>
<label>Theme</label><div class="seg">${th.map(t=>`<button class="${S.theme==t?'on':''}" data-act="theme" data-id="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>
<label>Your Last Match</label><div class="list"><div class="li"><span>${Object.keys(S.pf).filter(k=>S.pf[k]).map(k=>S.pf[k]).join(' · ')||'No preferences saved yet'}</span></div></div>
<div class="list"><div class="li"><span>Favorites</span><small>${S.fav.length}</small></div><div class="li"><span>In compare list</span><small>${S.cmp.length}</small></div></div>
${st.dp?`<button class="btn" data-act="install" style="margin-bottom:10px">Install CamMatch App</button>`:''}
<button class="btn ghost" data-act="reset">Clear saved data</button>
<p style="color:var(--mu);font-size:12px;margin-top:16px;text-align:center">CamMatch v1.0 · Prices & specs are approximate sample data.<br>by Dionimar Tumabini · BSIT 3 East</p>`}};
function homeBody(){if(st.q){const q=st.q.toLowerCase(),l=D.filter(c=>(c.n+c.b+c.t).toLowerCase().includes(q));return `<div class="grid" style="margin-top:14px">${l.map(c=>card(c)).join('')||empty('match','No match for "'+st.q.replace(/</g,'&lt;')+'"')}</div>`}
return `<div class="sec"><h2>Featured Cameras</h2><a data-act="all">See All</a></div><div class="car">${[1,2,10,8,4].map(i=>card(cam(i))).join('')}</div>
<div class="sec"><h2>Browse by Category</h2></div><div class="cats">${TYPES.map(t=>`<div class="cat" data-act="cat" data-id="${t}"><svg width="56" viewBox="0 0 120 90" style="border-radius:12px;background:${COL[t]}22"><g fill="#1f2937">${BODY[t]}</g><circle cx="${LX[t][0]}" cy="${LX[t][1]}" r="${LX[t][2]}" fill="${COL[t]}"/></svg>${t}<small>${D.filter(c=>c.t==t).length} models</small></div>`).join('')}</div>`}
// ---------- ROUTER ----------
function render(){const t=st.v;$('#v').innerHTML=V[t]();$('#nav').style.display=t=='details'?'none':'flex';
$('#nav').innerHTML=[['home','Home'],['match','Match'],['favs','Favorites'],['profile','Profile']].map(n=>`<button class="${st.tab==n[0]?'on':''}" data-act="tab" data-id="${n[0]}">${I(n[0]=='favs'?'heart':n[0])}${n[1]}</button>`).join('');
const q=$('#q');if(q)q.oninput=e=>{st.q=e.target.value.trim();$('#hl').innerHTML=homeBody()}}
function go(v,o={}){st.stack.push({v:st.v,sel:st.sel,res:st.res,tab:st.tab,q:st.q});Object.assign(st,{v},o);render();scrollTo(0,0);$('#app').scrollTop=0}
function back(){const p=st.stack.pop();p?Object.assign(st,p):st.v='home';render()}
function showRes(title,list,m){go('results',{res:{title,list,m,sort:m?'best match':'price (low to high)'}})}
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',1800)};
// ---------- EVENTS ----------
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const id=a.dataset.id,act=a.dataset.act;
if(act=='tab'){st.stack=[];st.tab=id;st.v=id;st.q='';render();scrollTo(0,0);$('#app').scrollTop=0}
else if(act=='back')back();
else if(act=='open')go('details',{sel:+id});
else if(act=='fav'){const i=S.fav.indexOf(+id);i<0?S.fav.push(+id):S.fav.splice(i,1);save();toast(i<0?'Saved to favorites':'Removed from favorites');
 if(st.v=='favs'||st.v=='details'||st.v=='results'||st.v=='home'){const y=scrollY;render();scrollTo(0,y)}}
else if(act=='cat')showRes(id+' Cameras',D.filter(c=>c.t==id).map(c=>({c,s:0})),false);
else if(act=='all')showRes('All Cameras',D.map(c=>({c,s:0})),false);
else if(act=='find'){S.pf={};document.querySelectorAll('[data-pf]').forEach(s=>S.pf[s.dataset.pf]=s.value);save();showRes('Camera Match Results',doMatch(S.pf),true)}
else if(act=='sort'){const r=st.res,o=['best match','price (low to high)','price (high to low)'].filter(x=>r.m||x!='best match'),n=o[(o.indexOf(r.sort)+1)%o.length];r.sort=n;
 r.list.sort(n=='best match'?(a,z)=>z.s-a.s:n.includes('low to')?(a,z)=>a.c.p-z.c.p:(a,z)=>z.c.p-a.c.p);render()}
else if(act=='addc'){const i=S.cmp.indexOf(+id);if(i>=0)return go('compare');if(S.cmp.length>=3)return toast('Compare list is full (max 3)');S.cmp.push(+id);save();toast('Added to compare');render()}
else if(act=='cmp')go('compare');
else if(act=='rmc'){S.cmp=S.cmp.filter(x=>x!=id);save();render()}
else if(act=='clr'){S.cmp=[];save();render()}
else if(act=='theme'){S.theme=id;save();applyTheme();render()}
else if(act=='reset'){if(confirm('Clear favorites, compare list and preferences?')){S.fav=[];S.cmp=[];S.pf={};save();render();toast('Data cleared')}}
else if(act=='install'){st.dp.prompt();st.dp=null;render()}});
const applyTheme=()=>{document.documentElement.dataset.theme=S.theme;document.querySelector('meta[name=theme-color]').content=S.theme=='dark'||(S.theme=='auto'&&matchMedia('(prefers-color-scheme:dark)').matches)?'#0d0f14':'#111827'};
// ---------- ONLINE / OFFLINE + PWA ----------
function net(){const n=$('#net'),on=navigator.onLine;n.className='net'+(on?'':' show');n.innerHTML=on?'':I('off','sm')+" You're offline – CamMatch still works";if(st.v=='profile')render()}
addEventListener('online',()=>{net();toast('Back online')});addEventListener('offline',net);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();st.dp=e;if(st.v=='profile')render()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{st.ready=true;if(st.v=='profile')render()}).catch(()=>{});
applyTheme();render();net();setTimeout(()=>$('#splash').classList.add('hide'),1300);
</script>
</body>
</html>
